# Claude Code builder for Pingzo (plan section 9; C1-BUILD-GO-1, Governance a769621).
# Runs only on pull request comments containing @claude from an allowlisted account.
# Every run waits for approval on environment `claude` (Taylor is the required reviewer); the key lives only there.
# No Bash tool, so no repository script runs while the key is present. Tests run in the secret-less ci.yml.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Allowlist (E4: BoaterGuy15 only; Taylor may add accounts). Issue comments run only on pull requests.
    if: >-
      contains(fromJSON('["BoaterGuy15"]'), github.actor) &&
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: claude
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"
          include_comments_by_actor: "BoaterGuy15"
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep"
